services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: teamops-api:latest
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://teamops:teamops@db:5432/teamops
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECURE_SSL_REDIRECT=False
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: teamops-api:latest
    command: celery -A teamops worker --loglevel=INFO
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://teamops:teamops@db:5432/teamops
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: teamops-api:latest
    command: celery -A teamops beat --loglevel=INFO
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://teamops:teamops@db:5432/teamops
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=teamops
      - POSTGRES_USER=teamops
      - POSTGRES_PASSWORD=teamops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
