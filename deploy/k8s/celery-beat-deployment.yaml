apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: teamops
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: teamops-api:latest
          imagePullPolicy: Never
          command: ["celery", "-A", "teamops", "beat", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
