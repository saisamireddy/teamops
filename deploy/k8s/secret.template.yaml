apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: teamops
type: Opaque
stringData:
  # 1. Strong Random Key (Generated for you)
  SECRET_KEY: "django-insecure-@9#x$m&p2*z7(w)4r-8t=5y[6u]1q!a>b<c,d."
  
  # 2. Database Connection
  # I used the credentials from your .env (teamops_user/teamops_pass)
  # Host matches Agent's default: 'postgres.teamops.svc.cluster.local'
  DATABASE_URL: "postgres://teamops_user:teamops_pass@postgres.teamops.svc.cluster.local:5432/teamops_db?sslmode=disable"
  
  # 3. Redis Connection
  # Host matches Agent's default: 'redis.teamops.svc.cluster.local'
  REDIS_URL: "redis://redis.teamops.svc.cluster.local:6379/0"
  
  # 4. Celery (Uses same Redis)
  CELERY_BROKER_URL: "redis://redis.teamops.svc.cluster.local:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis.teamops.svc.cluster.local:6379/0"

  # 5. SMTP (Required for invite emails)
  EMAIL_HOST_USER: "your-smtp-username"
  EMAIL_HOST_PASSWORD: "your-smtp-password"
