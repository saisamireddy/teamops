apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: teamops
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "teamops.example.com,backend-service,backend-service.teamops.svc.cluster.local,localhost,127.0.0.1"
  CSRF_TRUSTED_ORIGINS: "https://teamops.example.com"
  CORS_ALLOWED_ORIGINS: "https://teamops.example.com"
  SECURE_SSL_REDIRECT: "False"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
  SECURE_HSTS_PRELOAD: "True"
  LOG_LEVEL: "INFO"
  DB_SSL_REQUIRE: "False"
