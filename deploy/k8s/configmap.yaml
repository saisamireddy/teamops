apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: teamops
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "teamops.example.com,.trycloudflare.com,localhost,127.0.0.1,backend-service,backend-service.teamops.svc.cluster.local"
  CSRF_TRUSTED_ORIGINS: "https://teamops.example.com,https://*.trycloudflare.com"
  CORS_ALLOWED_ORIGINS: "https://teamops.example.com"
  SECURE_SSL_REDIRECT: "False"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
  SECURE_HSTS_PRELOAD: "True"
  LOG_LEVEL: "INFO"
  DB_SSL_REQUIRE: "False"
  FRONTEND_URL: "https://teamops.example.com"
  INVITE_ACCEPT_BASE_URL: "https://teamops.example.com/accept-invite"
  INVITE_TOKEN_TTL_HOURS: "72"
